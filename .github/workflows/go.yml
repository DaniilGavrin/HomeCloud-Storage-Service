name: HC Storage Service Go
on:
  push:
    branches: [main]
  pull_request:
jobs:
  go:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Test
        run: go test -race -count=1 ./...
      - name: Vet
        run: go vet ./...
      - name: Build
        run: go build ./...
      - name: Cross-build Windows
        env:
          GOOS: windows
          GOARCH: amd64
        run: go build ./...
